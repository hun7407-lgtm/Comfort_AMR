# slam_toolbox for the real AMR in a ~2.1 m wide corridor.
#
# Derived from nav3d/slam_params.yaml (which was tuned for a 12 m sim bay),
# changed where a long narrow corridor differs:
#
#   max_laser_range 10.0 -> 12.0   The corridor runs further than the bay did.
#   minimum_travel_distance 0.2    Kept. At 0.2 m/s teleop that is a keyframe
#   minimum_travel_heading  0.2    per second, which a sparse 230-beam scan
#   minimum_time_interval   0.2    needs -- fewer beams, so more overlap.
#   loop_search_space_dimension 8  Kept. The corridor is feature-poor along its
#                                  axis; a wider search mostly finds the wrong
#                                  place to close against.
#
# The scan is NOT the clean synthetic data the sim version assumed: 230 valid
# beams per sweep at irregular azimuths, from an upward-only non-repetitive
# scanner. That is why the travel thresholds stay small.
slam_toolbox:
  ros__parameters:
    use_sim_time: false

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.20
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # The operator walks behind the robot holding the E-STOP, so they are in
    # every rear scan. A cell becomes occupied when
    #     occupied_count / pass_through_count >= occupancy_threshold
    # and the slam_toolbox default of 0.1 makes "hit by one ray in ten" a wall.
    # A walking person is hit in a few frames and passed through in the rest,
    # so at 0.30 their trail stays free while a real wall -- hit by nearly
    # every ray -- is unaffected. Driving the corridor a second time lowers
    # their ratio further, because each extra pass adds misses, not hits.
    minimum_pass_through: 3
    occupancy_threshold: 0.30
