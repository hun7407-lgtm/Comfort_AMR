# ---------------------------------------------------------------
# The scene as it is mapped: the building, with nobody in it.
#
# Used only by ./scripts/run_mapping.sh, which looks for
# nav3d/mapping_<config stem>.yaml beside the config being mapped.
#
# The people are switched off here on purpose. A map is of what does
# not move: baking three standing workers into it would have every
# trial plan around people who may not be there, and the obstacle
# layer -- which is the channel the Comfort Space uses -- would have
# nothing left to contribute. It is the same reasoning that keeps
# the humans out of scripts/generate_map.py's grid.
#
# Everything else is the trial scene, unchanged: same shell, same
# columns, same machines. The map has to be of the building the
# trials run in.
# ---------------------------------------------------------------
base: configs/factory_long_3d.yaml

humans:
  c: {enabled: false}
  w1: {enabled: false}
  w2: {enabled: false}
  w3: {enabled: false}
  w4: {enabled: false}
