# Stage 2 uniform-scale sweep v2 -- Nav2-only (2026-11-26 night, ABBREVIATED schedule by user request:
# finish by 2026-11-27 20:00). Authority: docs/NAV2_ONLY_STAGE2_MAIN_EXPERIMENT_SPEC.md (overrides the
# protocol where they differ), docs/STAGE2_UNIFORM_SCALE_PROTOCOL.md.
#   python3 scripts/stage2scale_plan.py --config configs/stage2scale/stage2scale_v2_nav2only.yaml --phase pilot
#   python3 scripts/final_run.py --dir results/batches/261126_nav2only_stage2_v2_pilot
#   python3 scripts/stage2scale_report.py --dir results/batches/261126_nav2only_stage2_v2_pilot
# ASSUMPTION = study choice. ABBREVIATED = reduced from the spec for the deadline.

version: v2_nav2only
out_dir: configs/stage2scale/v2_nav2only          # never the v1 folder
batch_prefix: results/batches/261126_nav2only_stage2_v2
control_overlay: configs/nav2only/control_overlay.yaml   # control.mode nav2_only, buffer 0.10, no gate

# R_ref: set from the Nav2-only Stage 1 revalidation BEFORE the pilot (provenance recorded).
anchor_m: 0.95
anchor_provenance: new_nav2_only_upper     # 261126_nav2only_stage1: IDENTIFIED, upper 0.95, transition 1.00 (ABBREVIATED n=10)
moving_reference_speed_mps: 1.0
alphas: auto                              # 1.00, 0.90, ... down to the smallest alpha without min_radius clip
reference:
  stationary: N22a_B
  station_engaged: N22a_B
  moving: N22b_E1
criteria:
  comfort_metric: predicted_comfort_at_closest
  primary_target: 5.0
  sensitivity_targets:
  - 4.5
  - 5.5
  joint_min: 0.8
  nav_min: 0.8
  joint_min_sensitivity: 0.9
  min_distance_response_m: 0.1
  reference_speed_tolerance_mps: 0.1
scenarios:
  ST-F:
    state: stationary
    context: c3
    intended_sector: front
    primary: true
    label: Stationary, AMR passes in front
  ST-S:
    state: stationary
    context: c4
    intended_sector: side
    primary: true
    label: Stationary, AMR passes beside (person's right; left = TODO balance in pilot)
  ST-R:
    state: stationary
    context: c2
    intended_sector: rear
    primary: true
    label: Stationary, AMR passes behind
  EN-R:
    state: station_engaged
    context: c1
    intended_sector: rear
    primary: true
    label: Station engaged, AMR passes behind (stationary-reference TRANSFER)
  MV-P:
    state: moving
    intended_sector: side
    primary: true
    label: Moving, oncoming lateral pass in separate lanes
  MV-O:
    state: moving
    intended_sector: rear
    primary: false
    feasibility: overtake
    label: Moving, AMR overtakes (not run if infeasible)
geometry:
  static:
    corridor_length_m: 12.0
    person_wall_gap_m: 0.5
    path_offset_m: 0.3
    start_x: -5.0
    goal_x: 5.0
  moving:
    corridor_length_m: 16.0
    walker_start_x: 7.0
    walker_end_x: -7.0
    amr_start_x: -5.5
    amr_goal_x: 5.5
    lane_centre_y: 0.0
    human_side: 1.0
overtake:
  walker_speed_mps: 1.04
  amr_max_speed_mps: 1.0
  gain_m: 3.0

# Pilot (ABBREVIATED: 2 static widths instead of 4, one moving width): 2 launches per cell.
# Freeze rule, declared before the pilot (applied by scripts/stage2scale_freeze.py):
#   a geometry is TECHNICALLY INFEASIBLE if B1 does not complete every pilot launch or has a contact;
#   it is SENSITIVE if median d_cc(largest alpha with a completed passage, >= 0.70) minus median
#   d_cc(smallest alpha) >= criteria.min_distance_response_m (0.10 m), completed passages only.
#   Per context the FIRST geometry in the listed order that is feasible and sensitive is frozen
#   (static: narrowest width first; moving: gap 0.80, 0.65, 1.00). None -> UNIDENTIFIABLE_GEOMETRY,
#   context not run in coarse (reported).
phases:
  pilot:
    repeats: 2
    conditions: [B1, B2, "1.00", "0.70", min]
    geometry: candidates
    static_widths: [2.2, 2.6]
    moving_widths: [3.0]
    moving_lane_gaps: [0.80, 0.65, 1.00]
  coarse:
    repeats: 5                            # ABBREVIATED (spec: 10)
    conditions: [B1, B2, all]
    geometry: frozen
  confirm:
    repeats: 10                           # ABBREVIATED (spec: >= 30, plus a wide geometry)
    conditions: confirm                   # per scenario, from confirm_conditions below
    geometry: frozen

frozen: {}                                # written after the pilot (decision log)
confirm_conditions: {}                    # written after coarse: B1, B2, alpha*, next smaller tested alpha
