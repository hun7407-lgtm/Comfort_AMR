# ---------------------------------------------------------------
# Stage 2: the real-environment human comfort study. Platform + study
# settings. NOTHING scene-specific is decided here.
#
#   ./scripts/stage2_trial.sh --config configs/stage2/stage2_real.yaml \
#       --scenario configs/stage2/conditions/b3o_r1.00.yaml \
#       --scene configs/stage2/scenes/<corridor>.yaml --participant P01 --order 1
#
# Layering (comfort_core.config, `base:` chain + scenario overlay):
#
#   configs/common.yaml           shared Nav2 tuning, Comfort Space geometry
#   configs/real_amr.yaml         the real robot: footprint, speeds, LiDAR
#   configs/stage2/stage2_real.yaml   THIS: study parameters, result paths
#   configs/stage2/scenes/<x>.yaml    the corridor: SLAM map, start/goal,
#                                     the participant's post (TODO, see
#                                     configs/stage2/scene_template.yaml)
#   configs/stage2/conditions/b3o_r<size>.yaml   the size condition (scenario
#                                     overlay; scripts/stage2_make_conditions.py)
#
# The scene file goes LAST in the base chain so it can fill nav2.map,
# navigation.start/goal and humans without this file knowing them.
#
# The physical safety layer (navigation.collision_monitor, braking
# distance, protective field) comes from real_amr.yaml / common.yaml and
# is NOT a Stage 2 variable. The size conditions touch comfort_space only.
#
# > No real trial has been run with this file. Values marked TODO are
# > null on purpose and scripts/stage2_trial.py refuses to start until
# > they are filled.
# ---------------------------------------------------------------
base: configs/real_amr.yaml

stage2:
  # --- contexts x passing distances ---------------------------------
  # Human Contexts measured (comfort_core/contexts.py). Pilot: all four;
  # the main study drops c4 if the pilot shows it does not differ from c2/c3.
  # true = measured. Set c4 false here (not in code) if the pilot drops it.
  contexts:
    c1_engaged_rear: true
    c2_stationary_rear: true
    c3_stationary_front: true
    c4_stationary_side: true
  # Each (context, d) this many times per participant; every repeat is a
  # further Williams row inside the context block.
  trial_repeats: 1
  # Anonymous study codes only; stage2 tools refuse anything else (a name,
  # an e-mail). The key linking codes to people stays on paper.
  participant_id_pattern: "^P[0-9]{2,3}$"
  # Passing distances d, m, person centre -> nearest AMR surface (the Stage 1
  # x axis). Proposed 0.50 / 0.75 / 1.00 / 1.25 / 1.50; NOT set until the
  # lowest is checked against the real AMR's protective field, passing speed
  # and the safety briefing. Null = stage2_make_conditions refuses.
  distance_levels_m: null

  # --- the questionnaire -------------------------------------------
  # Wording and scale are HERE, not in code: change them after the pilot
  # and bump `version` (it is written into every response row). Keys are
  # fixed (comfort_core/stage2.py RATING_KEYS). `midpoint` marks a
  # bipolar item (too close .. just right .. too far).
  questionnaire:
    version: "v0-draft"
    language: ko
    items:
      - key: comfort_score
        primary: true
        scale_min: 1
        scale_max: 7
        text:
          ko: "로봇이 지나갈 때 얼마나 편안하게 느꼈습니까?"
          en: "How comfortable did you feel while the robot passed you?"
        anchors:
          ko: ["1 = 전혀 편안하지 않음", "7 = 매우 편안함"]
          en: ["1 = not at all comfortable", "7 = very comfortable"]
        source: "Neggers et al. 2022, perceived comfort, 7-point"
      - key: perceived_safety
        primary: false
        required: false
        scale_min: 1
        scale_max: 7
        text:
          ko: "로봇이 지나갈 때 얼마나 안전하다고 느꼈습니까?"
          en: "How safe did you feel while the robot passed you?"
        anchors:
          ko: ["1 = 전혀 안전하지 않음", "7 = 매우 안전함"]
          en: ["1 = not at all safe", "7 = very safe"]
        source: "TODO confirm wording against the HRI reference before use"
      - key: acceptability
        primary: false
        required: false
        scale_min: 1
        scale_max: 7
        midpoint: 4
        text:
          ko: "로봇이 지나간 거리는 어땠습니까?"
          en: "How was the distance at which the robot passed?"
        anchors:
          ko: ["1 = 너무 가까움", "4 = 적당함", "7 = 너무 멈"]
          en: ["1 = much too close", "4 = just right", "7 = much too far"]
        source: "TODO confirm wording against the HRI reference before use"
    comment_prompt:
      ko: "(선택) 하고 싶은 말이 있으면 적어 주세요."
      en: "(optional) Any comment?"

  # --- analysis rules ---------------------------------------------
  # How R_comfort_min and R_pref are read off the curve. NULL ON PURPOSE:
  # decided after the pilot. Until then scripts/stage2_analysis.py only
  # lists candidates (every cutoff, argmax, midpoint crossing).
  comfort_acceptance_score: null   # cutoff on the primary item
  acceptance_statistic: median     # median or mean, per (context, d)
  analysis:
    r_comfort_min_rule: null       # e.g. text of the pre-registered rule, after the pilot
    r_pref_rule: null              # null -> selection uses the fallback R* = R_comfort_min

  # --- safety / abort -----------------------------------------------
  # Trial statuses: NORMAL, OPERATOR_ABORT, PARTICIPANT_STOP, E_STOP,
  # NAVIGATION_FAILURE, INVALID_TRIAL (comfort_core/stage2.py). Ctrl+C
  # during a trial cancels the goal and asks which one.
  safety:
    # A std_msgs/Bool topic that is true while the hardware e-stop is
    # pressed, if the real AMR publishes one. TODO from the AMR's driver;
    # null = the operator records E_STOP by hand.
    estop_topic: null

  # --- trial protocol --------------------------------------------
  # Each participant sees every size; the order is a permutation drawn
  # from this seed + participant number (scripts/stage2_make_conditions.py
  # --orders), so the sequence is reproducible and not size-ordered.
  order_seed: 2026
  # Seconds the robot waits at the start pose before setting off, so
  # the participant is settled.
  settle_seconds: 3.0
  # Hard limit per passing, s.
  max_trial_time: 120.0
  # Where rows go: <results_dir>/<session>/{trials.csv, questionnaire.csv,
  # trajectories/<trial_id>.csv, <trial_id>.json}
  results_dir: results/stage2

  # --- what is recorded (for the reader; the code records all of it) --
  # AMR trajectory, travel time/distance, planned path length, minimum
  # human distance and when, human state/orientation/speed, applied
  # Comfort Space extents, intrusion into it, yield seconds, safety
  # stop/slowdown seconds, Nav2 status, questionnaire result.

comfort_space:
  # The proposed method. Sizes come from the condition overlays.
  policy: state_directional
  # min_radius is the person's own body; the ladder never goes below it.

humans:
  # The participant is placed by the scene file; the state is read from
  # the config (ground truth) because in Stage 2 the state is a CONDITION
  # the experimenter sets, not something to estimate.
  state_source: ground_truth
  # The simulated bay's people, inherited through configs/common.yaml,
  # are switched off here exactly as results/real/amr_deploy/bin/
  # make_comfort_cfg.py does for the real corridor. The scene file adds
  # the participant.
  a: {enabled: false}
  b: {enabled: false}
  c: {enabled: false}
  character: {enabled: false}
